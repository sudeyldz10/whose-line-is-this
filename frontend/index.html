<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whose Line Is This?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <div class="sparkles" aria-hidden="true">
    <b class="sp lime a"></b><b class="sp purple b"></b><b class="sp lime c"></b>
    <b class="sp blue d"></b><b class="sp green e"></b>
  </div>

  <main>
    <section id="screen-home" class="screen active">
      <h1 class="title" aria-label="Whose line is this?">
        <span class="t1" aria-hidden="true"><i style="--r:-9.0deg;--y:-0.000em">W</i><i style="--r:-4.5deg;--y:-0.098em">H</i><i style="--r:0.0deg;--y:-0.130em">O</i><i style="--r:4.5deg;--y:-0.098em">S</i><i style="--r:9.0deg;--y:-0.000em">E</i></span>
        <span class="t2" aria-hidden="true">LINE IS</span>
        <span class="t3" aria-hidden="true">THIS?</span>
      </h1>

      <button id="mic" class="mic" aria-label="Microphone">
        <svg class="rays" viewBox="0 0 250 100" aria-hidden="true">
          <g class="ray-l"><line x1="14" y1="10" x2="44" y2="24"/><line x1="2" y1="50" x2="44" y2="50"/><line x1="14" y1="90" x2="44" y2="76"/></g>
          <g class="ray-r"><line x1="236" y1="10" x2="206" y2="24"/><line x1="248" y1="50" x2="206" y2="50"/><line x1="236" y1="90" x2="206" y2="76"/></g>
        </svg>
        <img class="mic-img" src="img/mic.png" alt="" />
      </button>

      <p id="status" class="status">Tap the mic</p>
      <p id="heard" class="heard"></p>

      <form id="manual">
        <input id="manual-text" type="text" placeholder="Type the line if the mic isn't working..." autocomplete="off" />
        <button type="submit" class="pill small">Search</button>
      </form>
      <p id="error" class="error"></p>
    </section>

    <section id="screen-result" class="screen">
      <div class="card">
        <div class="photo-wrap">
          <img id="r-photo" alt="" />
          <span id="r-photo-kind" class="tag lime"></span>
        </div>
        <div class="info">
          <p class="tag green" id="r-conf"></p>
          <h2 id="r-character"></h2>
          <p class="title-line" id="r-title"></p>
          <blockquote id="r-quote"></blockquote>
          <p class="src">Source: <a id="r-source" target="_blank" rel="noopener noreferrer"></a></p>
          <p class="src"><a id="r-tmdb" target="_blank" rel="noopener noreferrer">TMDB page</a></p>
          <p class="disclaimer" id="r-disclaimer"></p>
          <button id="retry" class="pill">Try again</button>
        </div>
      </div>
    </section>

    <section id="screen-notfound" class="screen">
      <h2 class="nf-title">Not found</h2>
      <p class="banner" id="nf-reason">We couldn't match this line to a reliable source.</p>
      <p class="nf-sub">Speak a bit louder, or type the line instead.</p>
      <button id="retry2" class="pill">Try again</button>
    </section>
  </main>


  <footer>
    Movie and TV data from <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a>.
    This product uses the TMDB API but is not endorsed or certified by TMDB.
  </footer>

  <script src="app.js"></script>
</body>
</html>
