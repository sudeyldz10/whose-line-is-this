<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Whose Line Is This?</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-screen="menu">
  <div class="bg"></div>
  <div class="sparkles" aria-hidden="true">
    <b class="sp lime a"></b><b class="sp purple b"></b><b class="sp lime c"></b>
    <b class="sp blue d"></b><b class="sp green e"></b>
  </div>

  <button id="back" class="back pxbtn" type="button">&larr; Menu</button>

  <div id="warp" class="warp" aria-hidden="true">
    <div class="warp-bg"></div>
    <div class="warp-center">
      <img id="warp-icon" class="warp-icon" alt="" />
      <p id="warp-text" class="warp-text"></p>
      <div class="warp-bar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

  <main>
    <section id="screen-menu" class="screen active">
      <h1 class="title sm" aria-label="Whose line is this?">
        <span class="t1" aria-hidden="true"><i style="--r:-9.0deg;--y:-0.000em">W</i><i style="--r:-4.5deg;--y:-0.098em">H</i><i style="--r:0.0deg;--y:-0.130em">O</i><i style="--r:4.5deg;--y:-0.098em">S</i><i style="--r:9.0deg;--y:-0.000em">E</i></span>
        <span class="t2" aria-hidden="true">LINE IS</span>
        <span class="t3" aria-hidden="true">THIS?</span>
      </h1>

      <div class="menu-cards">
        <button type="button" class="mcard play" data-go="game">
          <img class="mc-mystery" src="img/mystery.png" alt="" />
          <span class="tag purple">Game &middot; Prize</span>
          <span class="mc-title">Guess the line</span>
          <span class="mc-text">We show the line, you name the character. Get all 5 right and win a prize!</span>
          <span class="pill alt mc-btn">Play</span>
        </button>
        <button type="button" class="mcard song" data-go="song" id="card-song">
          <img class="mc-img" src="img/note-ear.png" alt="" />
          <span class="edition">Song Edition</span>
          <span class="mc-title">Guess the song</span>
          <span class="mc-text">Hear a 3-second clip and name the song. Get all 5 right and win a prize!</span>
          <span class="pill blue mc-btn">Listen</span>
        </button>
      </div>
    </section>

    <section id="screen-game" class="screen">
      <div class="g-wrap">
        <div class="g-top">
          <span class="tag lime" id="g-round">Round 1/5</span>
          <span class="tag green" id="g-score">Score 0</span>
        </div>
        <div class="timer"><i id="g-timer"></i></div>
        <p class="g-ask">Who says this?</p>
        <div class="g-main">
          <img id="g-mystery" class="g-mystery" src="img/mystery.png" alt="" />
          <blockquote id="g-line" class="g-line"></blockquote>
        </div>
        <div id="g-options" class="g-options"></div>
        <div id="g-reveal" class="g-reveal">
          <p id="g-verdict" class="g-verdict"></p>
          <p id="g-answer" class="g-answer"></p>
          <button id="g-next" class="pxbtn" type="button">Next</button>
        </div>
        <p id="g-error" class="error"></p>
      </div>
    </section>

    <section id="screen-song" class="screen">
      <div class="g-wrap">
        <div class="g-top">
          <span class="tag green" id="s-round">Round 1/5</span>
          <span class="edition sm">Song Edition</span>
          <span class="tag green" id="s-score">Score 0</span>
        </div>
        <div class="timer"><i id="s-timer"></i></div>
        <p class="g-ask">Which song is this?</p>
        <div class="g-main">
          <img id="s-cd" class="s-cd" src="img/cd.png" alt="" />
          <div class="s-box">
            <div class="eq" id="s-eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <p id="s-status" class="s-status">Get ready</p>
            <button id="s-hear" class="pxbtn s-hear" type="button">Tap to hear</button>
          </div>
        </div>
        <div id="s-options" class="g-options"></div>
        <div id="s-reveal" class="g-reveal">
          <p id="s-verdict" class="g-verdict"></p>
          <p id="s-answer" class="g-answer"></p>
          <button id="s-next" class="pxbtn" type="button">Next</button>
        </div>
        <p id="s-error" class="error"></p>
      </div>
    </section>

    <section id="screen-gameover" class="screen">
      <h2 class="nf-title" id="go-title">You win!</h2>
      <img id="go-icon" class="go-icon" alt="" />
      <p class="go-score" id="go-score"></p>
      <p class="nf-sub" id="go-text"></p>
      <div class="go-btns">
        <button id="go-again" class="pill" type="button">Play again</button>
      </div>
    </section>
  </main>

  <footer>
    <span class="song-note">Song previews courtesy of Apple Music / iTunes.</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
